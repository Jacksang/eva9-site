<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard Mockup — eva9.ai</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6B7280;
    --line: #E5E7EB;
    --primary: #0D9488;
    --primary-hover: #0F766E;
    --surface: #F9FAFB;
    --surface-hover: #F3F4F6;
    --success: #16A34A;
    --error: #DC2626;
    --warning: #D97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --fg: #F9FAFB;
      --muted: #9CA3AF;
      --line: #374151;
      --primary: #14B8A6;
      --surface: #1F2937;
      --surface-hover: #374151;
      --success: #22C55E;
      --error: #EF4444;
      --warning: #F59E0B;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  svg { width: 100%; height: auto; display: block; }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .xs { font-size: 10px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .surface { fill: var(--surface); }
  .bg { fill: var(--bg); }
  .primary-bg { fill: var(--primary); }
  .white-fill { fill: #ffffff; }
  .pending-bg { fill: #FEF3C7; }
  .pending-text { fill: #92400E; font-size: 10px; font-weight: 600; }
  .success-bg { fill: #DCFCE7; }
  .success-text { fill: #15803D; font-size: 10px; font-weight: 600; }
  .error-bg { fill: #FEE2E2; }
  .error-text { fill: #991B1B; font-size: 10px; font-weight: 600; }
  .ai-bg { fill: #F3E8FF; }
  .ai-text { fill: #7E22CE; font-size: 9px; font-weight: 600; }
</style>
<main>
  <svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
    <!-- Header -->
    <rect x="0" y="0" width="1100" height="48" fill="var(--bg)" stroke="var(--line)" stroke-width="0.5"/>
    <text x="30" y="30" font-size="15" font-weight="700" fill="var(--primary)">Jacky Chen</text>
    <rect x="985" y="10" width="36" height="28" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="992" y="29" font-size="11" fill="var(--muted)">🌙</text>
    <rect x="940" y="10" width="40" height="28" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="946" y="29" font-size="10" fill="var(--fg)">EN|ZH</text>
    <rect x="860" y="10" width="75" height="28" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="870" y="29" font-size="11" fill="var(--muted)">← Back to Site</text>
    <line x1="0" y1="48" x2="1100" y2="48" stroke="var(--line)" stroke-width="0.5"/>

    <!-- Sidebar -->
    <rect x="0" y="48" width="200" height="652" fill="var(--surface)" stroke="var(--line)" stroke-width="0.5"/>
    <rect x="16" y="70" width="168" height="34" rx="6" fill="var(--primary)" opacity="0.15"/>
    <text x="40" y="92" font-size="13" fill="var(--primary)" font-weight="600">● Comments</text>
    <text x="36" y="120" font-size="13" fill="var(--muted)">  Users</text>
    <text x="36" y="148" font-size="13" fill="var(--muted)">  Messages</text>
    <text x="36" y="176" font-size="13" fill="var(--muted)">  Analytics</text>
    <line x1="16" y1="200" x2="184" y2="200" stroke="var(--line)" stroke-width="0.5"/>
    <text x="36" y="224" font-size="13" fill="var(--muted)">  Logout</text>

    <!-- Main content area -->
    <g transform="translate(220, 0)">
      <!-- Tab bar -->
      <rect x="0" y="60" width="880" height="40" fill="var(--bg)"/>
      <rect x="0" y="60" width="110" height="40" fill="var(--bg)" stroke="none"/>
      <text x="20" y="85" font-size="13" font-weight="600" fill="var(--primary)">Comments</text>
      <text x="125" y="85" font-size="13" fill="var(--muted)">Users</text>
      <text x="220" y="85" font-size="13" fill="var(--muted)">Messages</text>
      <text x="325" y="85" font-size="13" fill="var(--muted)">Analytics</text>
      <line x1="0" y1="100" x2="110" y2="100" stroke="var(--primary)" stroke-width="2"/>
      <line x1="0" y1="100" x2="880" y2="100" stroke="var(--line)" stroke-width="0.5"/>

      <!-- Filter -->
      <rect x="0" y="110" width="140" height="30" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="15" y="130" font-size="12" fill="var(--fg)">Filter: All ▼</text>

      <!-- Comment row 1 -->
      <rect x="0" y="155" width="850" height="100" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="20" y="180" font-size="14" font-weight="600" fill="var(--fg)">John Doe</text>
      <text x="20" y="198" font-size="11" fill="var(--muted)">john@example.com</text>
      <text x="20" y="218" font-size="12" fill="var(--muted)">On: "How I Built a Cloud-Native..."</text>
      <text x="20" y="238" font-size="12" fill="var(--fg)">"Great article! Very helpful for my project."</text>
      <!-- Status badge -->
      <rect x="570" y="170" width="58" height="22" rx="11" fill="#FEF3C7"/>
      <text x="578" y="185" font-size="10" fill="#92400E" font-weight="600">⏳ Pending</text>
      <text x="636" y="185" font-size="10" fill="var(--muted)">· 2h ago</text>
      <!-- AI badge -->
      <rect x="700" y="170" width="28" height="22" rx="4" fill="#F3E8FF"/>
      <text x="706" y="185" font-size="9" fill="#7E22CE" font-weight="600">AI</text>
      <!-- Action buttons -->
      <rect x="570" y="215" width="75" height="28" rx="6" fill="var(--success)"/>
      <text x="582" y="234" font-size="12" fill="#ffffff" font-weight="600">Approve</text>
      <rect x="655" y="215" width="70" height="28" rx="6" fill="var(--error)"/>
      <text x="666" y="234" font-size="12" fill="#ffffff" font-weight="600">Reject</text>

      <!-- Comment row 2 (flagged) -->
      <rect x="0" y="270" width="850" height="100" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="20" y="295" font-size="14" font-weight="600" fill="var(--fg)">Jane Smith</text>
      <text x="20" y="313" font-size="11" fill="var(--muted)">jane@example.com</text>
      <text x="20" y="333" font-size="12" fill="var(--muted)">On: "No-Code ML Getting Started"</text>
      <text x="20" y="353" font-size="12" fill="var(--fg)">"加微信 learnmore123 — 优惠课程"</text>
      <!-- Status badge -->
      <rect x="570" y="285" width="58" height="22" rx="11" fill="#FEF3C7"/>
      <text x="578" y="300" font-size="10" fill="#92400E" font-weight="600">⏳ Pending</text>
      <text x="636" y="300" font-size="10" fill="var(--muted)">· 5h ago</text>
      <!-- AI badge with reason -->
      <rect x="700" y="280" width="90" height="20" rx="4" fill="#F3E8FF"/>
      <text x="705" y="294" font-size="9" fill="#7E22CE" font-weight="600">AI: spam detected</text>
      <!-- Action buttons -->
      <rect x="570" y="330" width="75" height="28" rx="6" fill="var(--success)"/>
      <text x="582" y="349" font-size="12" fill="#ffffff" font-weight="600">Approve</text>
      <rect x="655" y="330" width="70" height="28" rx="6" fill="var(--error)"/>
      <text x="666" y="349" font-size="12" fill="#ffffff" font-weight="600">Reject</text>
    </g>
  </svg>
</main>
