<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog Post Mockup — eva9.ai</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6B7280;
    --line: #E5E7EB;
    --primary: #0D9488;
    --primary-hover: #0F766E;
    --surface: #F9FAFB;
    --surface-hover: #F3F4F6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --fg: #F9FAFB;
      --muted: #9CA3AF;
      --line: #374151;
      --primary: #14B8A6;
      --surface: #1F2937;
      --surface-hover: #374151;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 1060px; margin: 0 auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .xs { font-size: 10px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .primary-fill { fill: var(--primary); }
  .primary-text { fill: #ffffff; }
  .surface { fill: var(--surface); }
  .bg { fill: var(--bg); }
  .teal-badge { fill: #CCFBF1; }
  .teal-badge-text { fill: #0F766E; font-size: 10px; font-weight: 600; }
  .code-bg { fill: #1F2937; }
  .code-text { fill: #34D399; font-size: 12px; font-family: "JetBrains Mono", monospace; }
</style>
<main>
  <svg viewBox="0 0 1060 900" xmlns="http://www.w3.org/2000/svg">
    <!-- Header -->
    <rect x="0" y="0" width="1060" height="56" fill="var(--bg)" stroke="var(--line)" stroke-width="0.5"/>
    <text x="30" y="36" font-size="16" font-weight="700" fill="var(--primary)">Jacky Chen</text>
    <rect x="950" y="14" width="40" height="28" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="956" y="33" font-size="12" fill="var(--muted)">🌙</text>
    <rect x="900" y="14" width="46" height="28" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="908" y="33" font-size="11" fill="var(--fg)">EN|ZH</text>
    <rect x="812" y="14" width="44" height="28" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
    <text x="820" y="33" font-size="11" fill="var(--primary)">Login</text>
    <rect x="760" y="14" width="48" height="28" rx="6" fill="var(--primary)"/>
    <text x="769" y="33" font-size="11" fill="#ffffff" font-weight="600">Register</text>
    <line x1="0" y1="56" x2="1060" y2="56" stroke="var(--line)" stroke-width="0.5"/>

    <!-- Back link -->
    <text x="60" y="90" font-size="13" fill="var(--primary)">← Back to Blog</text>

    <!-- Centered content column -->
    <g transform="translate(190, 0)">
      <!-- Category badge + metadata -->
      <rect x="0" y="108" width="44" height="22" rx="11" fill="#CCFBF1"/>
      <text x="10" y="123" font-size="10" fill="#0F766E" font-weight="600">Work</text>
      <text x="54" y="123" font-size="12" fill="var(--muted)">Jun 1, 2026 · 8 min read</text>

      <!-- Title -->
      <text x="0" y="170" font-size="28" font-weight="700" fill="var(--fg)">How I Built a Cloud-Native</text>
      <text x="0" y="202" font-size="28" font-weight="700" fill="var(--fg)">E-Commerce Platform</text>

      <!-- Author -->
      <text x="0" y="230" font-size="14" fill="var(--muted)">By Jacky Chen</text>

      <!-- Divider -->
      <line x1="0" y1="250" x2="680" y2="250" stroke="var(--line)" stroke-width="0.5"/>

      <!-- Post body (Markdown rendered) -->
      <text x="0" y="285" font-size="14" fill="var(--fg)">Building a cloud-native e-commerce platform is a complex</text>
      <text x="0" y="305" font-size="14" fill="var(--fg)">but rewarding challenge. In this post, I'll share the</text>
      <text x="0" y="325" font-size="14" fill="var(--fg)">architecture and key decisions behind our stack.</text>

      <text x="0" y="365" font-size="18" font-weight="600" fill="var(--fg)">Architecture Overview</text>

      <text x="0" y="395" font-size="14" fill="var(--fg)">The architecture follows a microservices pattern with</text>
      <text x="0" y="415" font-size="14" fill="var(--fg)">AWS Lambda for compute and DynamoDB for storage.</text>

      <!-- Code block -->
      <rect x="0" y="440" width="650" height="80" rx="8" fill="var(--code-bg, #1F2937)"/>
      <text x="20" y="465" font-size="12" fill="#34D399" font-family="monospace">const deploy = (config) =&gt; &#123;</text>
      <text x="20" y="485" font-size="12" fill="#34D399" font-family="monospace">  return cloudformation.deploy(config);</text>
      <text x="20" y="505" font-size="12" fill="#34D399" font-family="monospace">&#125;</text>

      <!-- Image placeholder -->
      <rect x="0" y="545" width="650" height="200" rx="8" fill="#E2E8F0"/>
      <rect x="300" y="630" width="50" height="30" rx="4" fill="#94A3B8"/>
      <text x="295" y="640" font-size="11" fill="#ffffff">📷</text>
      <text x="260" y="665" font-size="12" fill="#64748B">Architecture diagram</text>
      <text x="200" y="755" font-size="12" fill="var(--muted)" font-style="italic">Figure 1: System architecture</text>

      <text x="0" y="800" font-size="18" font-weight="600" fill="var(--fg)">Results</text>
      <text x="0" y="830" font-size="14" fill="var(--fg)">The platform now handles 10K+ orders per minute with</text>
      <text x="0" y="850" font-size="14" fill="var(--fg)">99.9% uptime...</text>

      <!-- Divider -->
      <line x1="0" y1="880" x2="680" y2="880" stroke="var(--line)" stroke-width="0.5"/>

      <!-- Prev/Next -->
      <text x="0" y="910" font-size="13" fill="var(--primary)">← Previous Post</text>
      <text x="520" y="910" font-size="13" fill="var(--primary)">Next Post →</text>

      <!-- Comments section -->
      <line x1="0" y1="940" x2="680" y2="940" stroke="var(--line)" stroke-width="0.5"/>
      <text x="0" y="975" font-size="18" font-weight="600" fill="var(--fg)">Comments (3)</text>

      <!-- Comment 1 -->
      <rect x="0" y="995" width="650" height="80" rx="8" fill="var(--surface)"/>
      <circle cx="25" cy="1015" r="16" fill="var(--primary)"/>
      <text x="21" y="1020" font-size="11" fill="#ffffff" font-weight="600">J</text>
      <text x="52" y="1020" font-size="13" font-weight="600" fill="var(--fg)">Jane Doe</text>
      <text x="170" y="1020" font-size="11" fill="var(--muted)">· 2 hours ago</text>
      <text x="52" y="1045" font-size="13" fill="var(--fg)">Great analysis! I especially liked the section on auto-scaling</text>
      <text x="52" y="1063" font-size="13" fill="var(--fg)">strategies.</text>

      <!-- Comment 2 -->
      <rect x="0" y="1085" width="650" height="80" rx="8" fill="var(--surface)"/>
      <circle cx="25" cy="1105" r="16" fill="#F59E0B"/>
      <text x="21" y="1110" font-size="11" fill="#ffffff" font-weight="600">M</text>
      <text x="52" y="1110" font-size="13" font-weight="600" fill="var(--fg)">Mike Chen</text>
      <text x="172" y="1110" font-size="11" fill="var(--muted)">· 1 hour ago</text>
      <text x="52" y="1135" font-size="13" fill="var(--fg)">Have you considered using Kubernetes instead?</text>

      <!-- Comment form -->
      <line x1="0" y1="1190" x2="650" y2="1190" stroke="var(--line)" stroke-width="0.5"/>
      <text x="0" y="1220" font-size="14" font-weight="600" fill="var(--fg)">Leave a Comment</text>
      <rect x="0" y="1235" width="650" height="60" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="15" y="1270" font-size="13" fill="var(--muted)">Write your comment...</text>
      <rect x="540" y="1310" width="110" height="34" rx="8" fill="var(--primary)"/>
      <text x="558" y="1332" font-size="13" fill="#ffffff" font-weight="600">Submit</text>
    </g>
  </svg>
</main>
