    <text x="60" y="100" font-size="36" font-weight="700" fill="var(--fg)">👋 Hi, I'm Jacky Chen</text>
    <text x="60" y="128" font-size="16" fill="var(--muted)">20+ years building cloud-native e-commerce platforms.</text>
    <text x="60" y="148" font-size="16" fill="var(--muted)">I write about technology, learning, and life.</text>

    <rect x="60" y="170" width="120" height="38" rx="8" fill="var(--primary)"/>
    <text x="86" y="194" font-size="13" fill="#ffffff" font-weight="600">About Me</text>
    <rect x="192" y="170" width="130" height="38" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
    <text x="215" y="194" font-size="13" fill="var(--primary)" font-weight="600">My Services</text>

    <!-- Explore by Category -->
